name: life_track
description: "LifeTrack - Birthday tracker with live age stats, reminders and sharing"
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core utility
  uuid: ^4.5.1

  # UI
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_database: ^11.0.0

  # State Management
  provider: ^6.1.2

  # Local Database (Offline support)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4

  # Date & formatting
  intl: ^0.19.0

  # Biometric authentication
  local_auth: ^2.2.0

  # Share / Screenshot (birthday card sharing)
  share_plus: ^10.0.0
  screenshot: ^3.0.0
  path_provider: ^2.1.4

  # Local storage for DOB saving
  shared_preferences: ^2.2.2

  # App version display in Settings
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#5533FF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#5533FF"
    theme_color: "#5533FF"

flutter_native_splash:
  color: "#5533FF"
  image: "assets/icon/icon_foreground.png"
  android_12:
    color: "#5533FF"
    image: "assets/icon/icon_foreground.png"
  web: false